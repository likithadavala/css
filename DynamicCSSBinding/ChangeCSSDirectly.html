<!DOCTYPE html>
<html>
    <head>
        <title>Change CSS Directly</title>
        <style>
            #divbox{
                width: 200px;
                padding: 20px;
                background-color: lightblue;
            }
        </style>
        <script defer>
            function onClickChangeColour(){
                debugger;
                document.getElementById("divbox").style.backgroundColor ="green";
            }
        </script>
    </head>
    <body>
        <h1>Change CSS Directly</h1>
        <button id="btnChangeColour" onclick="onClickChangeColour()">Change Colour</button>
        <div id="divbox">Dynamic CSS Template Binding</div>
    </body>
</html>
