<!DOCTYPE html>
<html>

<head>
    <title>Progress Bar</title>
    <style>
        .container {
            width: 300px;
            height: 30px;
            border: 1px solid black;
        }

        #progress {
            width: 0;
            height: 100%;
            background: green;
        }
    </style>
    <script defer>
         function onClickIncrease() {
            debugger;
        let value = 0;
            value += 10;
            document.getElementById("progress").style.width = value + "%";
        }
    </script>
</head>

<body>
    <h1>Progress Bar:</h1>
    <button id="btnIncrease" onclick="onClickIncrease()">Increase</button>
    <div id="container">
        <div id="progress"></div>
    </div>
</body>

</html>
