<!DOCTYPE html>
<html>

<head>
    <title>Dark Mode Toggle</title>
    <style>
        .dark{
            background: black;
            color: white;
        }
    </style>
    <script defer>
        function onClickDarkMode(){
            debugger;
            document.body.classList.toggle("dark");
        }
    </script>
</head>

<body>
    <h1>Dark Mode Toggle:</h1>
    <button onclick="onClickDarkMode()">Dark Mode</button>
</body>

</html>
