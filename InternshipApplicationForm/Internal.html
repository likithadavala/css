<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Application Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #fff;
            width: 700px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #2a5d9f;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="tel"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .name {
            display: flex;
            gap: 15px;
        }

        .name input {
            width: 100%;
        }

        .gender {
            display: flex;
            gap: 25px;
            margin-top: 8px;
        }

        .gender label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0;
        }

        .skills {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .skills label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #2a5d9f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: #1d4677;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Internship Application Form</h1>
        <form>

            <label>Name</label>
            <div class="name">
                <input type="text" id="firstName" placeholder="First Name" required>
                <input type="text" id="lastName" placeholder="Last Name" required>
            </div>
            <label>Date of Birth</label>
            <input type="date" id="dob" required>
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter Phone Number" required>
            <label>Address</label>
            <input type="text" id="address" placeholder="Enter your Address">
            <label>Gender</label>
            <div class="gender">
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Others"> Others</label>
            </div>
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your Email">
            <label>Education</label>
            <input type="text" id="education" placeholder="Enter your Education Details">
            <label>Name of the School / College</label>
            <input type="text" id="school" placeholder="Enter School/College Name">
            <label>Attach your CV</label>
            <input type="file" id="cv">
            <label>Area of Interested Skills</label>
            <div class="skills">
                <label><input type="checkbox"> Frontend</label>
                <label><input type="checkbox"> Backend</label>
                <label><input type="checkbox"> Frontend & Backend</label>
                <label><input type="checkbox"> AI / ML</label>
                <label><input type="checkbox"> Data Analyst</label>
            </div>
            <label>Personal Statement</label>
            <textarea rows="5" placeholder="Write about yourself..."></textarea>\
            <button type="submit">Submit Application</button>
        </form>

    </div>

</body>

</html>
